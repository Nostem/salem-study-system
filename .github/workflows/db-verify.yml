name: Verify DB Deploy State

# Standalone read-only check. Migration verification lives in db-migrate.yml
# after apply, not in an independently racing migration-triggered job.
# Snapshot sampling is optional and does not prove current function invocation.
on:
  workflow_dispatch:
    inputs:
      check_snapshots:
        description: "Also validate the latest 5 stored snapshots (requires a nonempty sample)"
        type: boolean
        required: false
        default: false

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    env:
      SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Install postgresql client
        run: sudo apt-get update && sudo apt-get install -y postgresql-client

      - name: Verify database deployment
        env:
          CHECK_SNAPSHOTS: ${{ inputs.check_snapshots || false }}
        run: |
          set -euo pipefail
          : "${SUPABASE_DB_URL:?SUPABASE_DB_URL secret is required}"
          psql "${SUPABASE_DB_URL}" -X -v ON_ERROR_STOP=1 \
            -v check_snapshots="${CHECK_SNAPSHOTS}" -f scripts/verify_db_deploy.sql
