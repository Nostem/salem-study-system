name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  # Single job: install once, generate+validate quiz data once, test, build once,
  # smoke-test that one build, upload. (Quiz data is a build artifact regenerated here,
  # not committed — see scripts/build_quiz_data.py.)
  verify-build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: site/package-lock.json

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Install Node dependencies
        working-directory: site
        run: npm ci

      - name: Install Python dependencies
        run: python3 -m pip install -r requirements-dev.txt

      - name: Resolve Playwright version
        id: playwright-version
        working-directory: site
        run: echo "version=$(node -p "require('@playwright/test/package.json').version")" >> "$GITHUB_OUTPUT"

      - name: Cache Playwright browsers
        id: playwright-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.playwright-version.outputs.version }}

      - name: Install Playwright (chromium)
        working-directory: site
        run: |
          if [ "${{ steps.playwright-cache.outputs.cache-hit }}" = "true" ]; then
            npx playwright install-deps chromium
          else
            npx playwright install --with-deps chromium
          fi

      # Generate the 4 quiz-data build artifacts and validate them. This is the gate that
      # catches data problems (e.g. a broken correct-answer marker). It runs once; the build
      # step below uses build:astro/build:search directly so it does not regenerate.
      - name: Generate + validate quiz data
        run: python3 scripts/build_quiz_data.py

      - name: Python unit tests
        run: python3 -m unittest discover -s tests

      - name: Node tests
        working-directory: site
        run: npm run test:node

      - name: Type check
        working-directory: site
        run: npm run check

      - name: Build site
        working-directory: site
        env:
          PUBLIC_SUPABASE_URL: ${{ vars.PUBLIC_SUPABASE_URL }}
          PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.PUBLIC_SUPABASE_ANON_KEY }}
        run: npm run build:astro && npm run build:search

      - name: UI smoke checks (against the built site)
        working-directory: site
        env:
          PUBLIC_SUPABASE_URL: ${{ vars.PUBLIC_SUPABASE_URL }}
          PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.PUBLIC_SUPABASE_ANON_KEY }}
        run: npm run test:ui:run

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: site/dist

  deploy:
    needs: [verify-build]
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
