name: Redirect GitHub Pages to Vercel

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

env:
  TARGET_ORIGIN: https://salem-study-system.vercel.app
  OLD_BASE_PATH: /salem-study-system

jobs:
  build-redirect:
    runs-on: ubuntu-latest
    steps:
      - name: Build redirect artifact
        run: |
          set -euo pipefail
          mkdir -p pages-redirect/salem-study-system
          cat > pages-redirect/index.html <<'HTML'
          <!doctype html>
          <html lang="en">
            <head>
              <meta charset="utf-8" />
              <meta name="robots" content="noindex" />
              <meta name="viewport" content="width=device-width, initial-scale=1" />
              <title>Salem Study System has moved</title>
              <script>
                location.replace('https://salem-study-system.vercel.app/' + location.search + location.hash);
              </script>
            </head>
            <body>
              <p>Salem Study System has moved to <a href="https://salem-study-system.vercel.app/">https://salem-study-system.vercel.app/</a>.</p>
            </body>
          </html>
          HTML
          cat > pages-redirect/salem-study-system/index.html <<'HTML'
          <!doctype html>
          <html lang="en">
            <head>
              <meta charset="utf-8" />
              <meta name="robots" content="noindex" />
              <meta name="viewport" content="width=device-width, initial-scale=1" />
              <title>Salem Study System has moved</title>
              <script>
                location.replace('https://salem-study-system.vercel.app/' + location.search + location.hash);
              </script>
            </head>
            <body>
              <p>Salem Study System has moved to <a href="https://salem-study-system.vercel.app/">https://salem-study-system.vercel.app/</a>.</p>
            </body>
          </html>
          HTML
          cat > pages-redirect/404.html <<'HTML'
          <!doctype html>
          <html lang="en">
            <head>
              <meta charset="utf-8" />
              <meta name="robots" content="noindex" />
              <meta name="viewport" content="width=device-width, initial-scale=1" />
              <title>Salem Study System has moved</title>
              <script>
                const oldBase = '/salem-study-system';
                const targetOrigin = 'https://salem-study-system.vercel.app';
                const path = location.pathname.startsWith(oldBase)
                  ? location.pathname.slice(oldBase.length) || '/'
                  : location.pathname;
                location.replace(targetOrigin + path + location.search + location.hash);
              </script>
            </head>
            <body>
              <p>Salem Study System has moved to <a href="https://salem-study-system.vercel.app/">https://salem-study-system.vercel.app/</a>.</p>
            </body>
          </html>
          HTML
      - name: Upload Pages redirect artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: pages-redirect

  deploy:
    needs: [build-redirect]
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: https://nostem.github.io/salem-study-system/
    steps:
      - name: Deploy redirect to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
